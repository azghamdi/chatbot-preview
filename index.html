@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap");
.gastat-chat-root {
  position: fixed; bottom: 24px; right: 24px; z-index: 1000;
  font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
}
.gastat-chat-root button, .gastat-chat-root textarea { font-family: inherit; }
.gastat-chat-anchor { position: relative; }

.gastat-chat {
  position: absolute; right: 0; bottom: calc(100% + 16px);
  width: 370px; height: min(600px, calc(100vh - 120px));
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--background-white, #fff); border-radius: 20px;
  box-shadow: 0 20px 50px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .06);
  transform-origin: bottom right;
  animation: gastat-chat-in .28s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes gastat-chat-in { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
@media (max-width: 480px) {
  .gastat-chat-root { right: 16px; bottom: 16px; }
  .gastat-chat { width: calc(100vw - 32px); height: calc(100vh - 110px); }
}

/* \u0627\u0644\u0647\u064A\u062F\u0631 */
.gastat-chat__header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; color: #fff;
  background: linear-gradient(135deg, var(--background-primary, #1B8354) 0%, #14573A 100%);
}
.gastat-chat__id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.gastat-chat__avatar {
  position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #fff 0%, #E7F4EC 60%, #CFE9DA 100%);
  overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.85);
}
.gastat-chat__avatar img { position: absolute; left: 50%; top: 3px; width: 46px; transform: translateX(-50%); }
